[project]
name = "terrarium"
version = "0.0.1"
description = "Programmatic definition and execution of multi-stage, multi-turn agent tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.2.2",
    "docker>=7.0.0",
    "psycopg2-binary>=2.9.0",
    "caldav==2.2.4",
    "notion-client>=3.0.0",
    "gspread>=6.2.1",
    "google-api-python-client>=2.193.0",
    "litellm>=1.0",
    "langchain-core>=0.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
terrarium = "terrarium.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
